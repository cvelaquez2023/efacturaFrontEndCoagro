<h1 mat-dialog-title color="warn">
  {{ actionBtn === "Guardar" ? "Adicionar" : "Editar" }} Bodega
</h1>
<div mat-dialog-content class="dialog-content">
  <form [formGroup]="bodegaForm">
    <div class="row">
      <div class="col-12 col-md-30">
        <mat-form-field appearance="outline">
          <mat-label>Código</mat-label>
          <input
            formControlName="codigo"
            matInput
            placeholder="Código"
            maxlength="4"
          />
          <mat-error *ngIf="codigoField.hasError('required')"
            >El código es requerido</mat-error
          >
        </mat-form-field>
      </div>
      <div class="col-12 col-md-70">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input
            formControlName="nombre"
            matInput
            placeholder="Nombre"
            maxlength="40"
          />
          <mat-error *ngIf="nombreField.hasError('required')"
            >El nombre es requerido</mat-error
          >
        </mat-form-field>
      </div>
    </div>
    <div class="row" *ngIf="!ediData">
      <div class="col-12">
        <mat-form-field appearance="outline">
          <mat-label>Bodega del ERP</mat-label>
          <mat-select formControlName="bodegaErp">
            <mat-option
              *ngFor="let bodega of bodegasErpDisponibles"
              [value]="bodega.BODEGA"
            >
              {{ bodega.BODEGA }} - {{ bodega.NOMBRE }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="bodegaErpField.hasError('required')"
            >Debe vincular una bodega del ERP</mat-error
          >
        </mat-form-field>
      </div>
    </div>
  </form>
</div>
<div mat-dialog-actions [align]="'end'">
  <button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
  <button mat-raised-button color="warn" (click)="clickSave()">
    {{ actionBtn }}
  </button>
</div>
