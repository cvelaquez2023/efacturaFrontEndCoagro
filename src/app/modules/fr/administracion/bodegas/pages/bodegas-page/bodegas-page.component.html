<h2>Bodegas</h2>

<div class="search-div" fxLayout="row" fxLayoutAlign="end end">
  <button mat-raised-button color="warn" (click)="openDialog()">
    <mat-icon>add</mat-icon>Crear
  </button>
</div>

<form class="buscar">
  <mat-form-field class="full-with" appearance="fill">
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Buscar Bodega"
      #input
    />
  </mat-form-field>
</form>
<div class="mat-elevation-z8">
  <mat-table [dataSource]="listBodegas" matSort>
    <ng-container matColumnDef="codigo">
      <mat-header-cell *matHeaderCellDef mat-sort-header
        >Código</mat-header-cell
      >
      <mat-cell *matCellDef="let element">{{ element.BODEGA }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="nombre">
      <mat-header-cell *matHeaderCellDef mat-sort-header
        >Nombre</mat-header-cell
      >
      <mat-cell *matCellDef="let element">{{ element.NOMBRE }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="vinculoErp">
      <mat-header-cell *matHeaderCellDef>Vínculo ERP</mat-header-cell>
      <mat-cell *matCellDef="let element">
        <span *ngIf="esCargaDirecta(element)">Directo del ERP</span>
        <span *ngIf="!esCargaDirecta(element) && element.BODEGA_ERP"
          >Bodega {{ element.BODEGA_ERP }}</span
        >
        <span *ngIf="!element.BODEGA_ERP">—</span>
      </mat-cell>
    </ng-container>
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef></mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="clickEdit(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="clickDelete(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">
        No hay datos que coincidan con el filtro "{{ input.value }}"
      </td>
    </tr>
  </mat-table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
