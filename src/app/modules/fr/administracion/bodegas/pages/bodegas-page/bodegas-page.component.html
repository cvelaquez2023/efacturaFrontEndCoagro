<div class="fr-page">
<h2 class="fr-title">Bodegas</h2>

<div class="fr-card fr-toolbar">
<form class="fr-search">
  <mat-form-field class="full-with" appearance="fill">
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Buscar Bodega"
      #input
    />
  </mat-form-field>
</form>
  <button mat-raised-button color="warn" (click)="openDialog()">
    <mat-icon>add</mat-icon>Crear
  </button>
</div>
<div class="fr-table-wrap">
  <table mat-table [dataSource]="listBodegas" matSort>
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Código</th
      >
      <td mat-cell *matCellDef="let element">{{ element.BODEGA }}</td>
    </ng-container>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Nombre</th
      >
      <td mat-cell *matCellDef="let element">{{ element.NOMBRE }}</td>
    </ng-container>
    <ng-container matColumnDef="vinculoErp">
      <th mat-header-cell class="fr-center" *matHeaderCellDef>Vínculo ERP</th>
      <td mat-cell class="fr-center" *matCellDef="let element">
        <span *ngIf="esCargaDirecta(element)">Directo del ERP</span>
        <span *ngIf="!esCargaDirecta(element) && element.BODEGA_ERP"
          >Bodega {{ element.BODEGA_ERP }}</span
        >
        <span *ngIf="!element.BODEGA_ERP">—</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <button mat-icon-button (click)="clickEdit(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="clickDelete(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell fr-empty" colspan="4">
        No hay datos que coincidan con el filtro "{{ input.value }}"
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
