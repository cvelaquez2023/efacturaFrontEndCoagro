<h1 mat-dialog-title color="warn">Nueva Actualizacion</h1>
<div mat-dialog-content>
	<form [formGroup]="actualizacionForm">
		<mat-form-field appearance="outline">
			<mat-label>Nombre del archivo</mat-label>
			<input formControlName="nombre" matInput placeholder="Nombre" />
			<mat-error *ngIf="nombreField.hasError('required')">El nombre es requerido</mat-error>
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>Tipo</mat-label>
			<mat-select formControlName="tipo">
				<mat-option value="Paquete">Paquete</mat-option>
				<mat-option value="Reporte">Reporte</mat-option>
				<mat-option value="Otros">Otros</mat-option>
			</mat-select>
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>HandHelds asociados</mat-label>
			<input formControlName="handhelds" matInput placeholder="Ej. HH01, HH02" />
			<mat-error *ngIf="handheldsField.hasError('required')">Debe indicar al menos un HandHeld</mat-error>
		</mat-form-field>
	</form>
</div>
<div mat-dialog-actions [align]="'end'">
	<button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
	<button mat-raised-button color="warn" (click)="clickSave()">Guardar</button>
</div>
