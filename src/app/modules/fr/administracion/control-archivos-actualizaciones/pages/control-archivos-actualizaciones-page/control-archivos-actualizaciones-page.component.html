<div class="fr-page">
<h2 class="fr-title">Control de Archivos y Actualizaciones</h2>

<div class="fr-card fr-toolbar justify-content-end">
  <button mat-raised-button color="warn" (click)="openDialog()">
    <mat-icon>add</mat-icon>Nuevo
  </button>
</div>

<div class="fr-table-wrap">
  <table mat-table [dataSource]="listActualizaciones" matSort>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Nombre</th
      >
      <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
    </ng-container>
    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
      <td mat-cell *matCellDef="let element">{{ element.tipo }}</td>
    </ng-container>
    <ng-container matColumnDef="fecha">
      <th mat-header-cell class="fr-center" *matHeaderCellDef mat-sort-header>Fecha</th>
      <td mat-cell class="fr-center" *matCellDef="let element">{{
        element.fecha | date: "shortDate"
      }}</td>
    </ng-container>
    <ng-container matColumnDef="handhelds">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >HandHelds Asociados</th
      >
      <td mat-cell *matCellDef="let element">{{ element.handhelds }}</td>
    </ng-container>
    <ng-container matColumnDef="publicada">
      <th mat-header-cell class="fr-center" *matHeaderCellDef mat-sort-header
        >Publicada</th
      >
      <td mat-cell class="fr-center" *matCellDef="let element">
        <mat-icon [color]="element.publicada ? 'primary' : 'warn'">{{
          element.publicada ? "check_circle" : "schedule"
        }}</mat-icon>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <button
          mat-icon-button
          [disabled]="element.publicada"
          (click)="publicar(element)"
          matTooltip="Publicar"
        >
          <mat-icon>publish</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
