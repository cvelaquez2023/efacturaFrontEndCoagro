<h2>Dashboard General</h2>

<div class="kpi-row" fxLayout="row wrap" fxLayoutGap="16px">
  <mat-card *ngFor="let kpi of kpis" class="kpi-card">
    <mat-card-content
      fxLayout="row"
      fxLayoutAlign="start center"
      fxLayoutGap="12px"
    >
      <mat-icon [color]="kpi.color">{{ kpi.icono }}</mat-icon>
      <div>
        <div class="kpi-valor">{{ kpi.valor }}</div>
        <div class="kpi-titulo">{{ kpi.titulo }}</div>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<h3>Ranking de Rutas del Dia</h3>
<div class="mat-elevation-z8">
  <table mat-table [dataSource]="ranking" class="full-with">
    <ng-container matColumnDef="ruta">
      <th mat-header-cell *matHeaderCellDef>Ruta</th>
      <td mat-cell *matCellDef="let element">{{ element.ruta }}</td>
    </ng-container>
    <ng-container matColumnDef="agente">
      <th mat-header-cell *matHeaderCellDef>Agente</th>
      <td mat-cell *matCellDef="let element">{{ element.agente }}</td>
    </ng-container>
    <ng-container matColumnDef="visitas">
      <th mat-header-cell *matHeaderCellDef>Visitas</th>
      <td mat-cell *matCellDef="let element">{{ element.visitas }}</td>
    </ng-container>
    <ng-container matColumnDef="vendido">
      <th mat-header-cell *matHeaderCellDef>Vendido</th>
      <td mat-cell *matCellDef="let element">
        {{ element.vendido | currency: "USD" }}
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="rankingColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: rankingColumns"></tr>
  </table>
</div>
