<div class="fr-page fr-dialog">
<h1 mat-dialog-title color="warn">
  {{ actionBtn === "Guardar" ? "Adicionar" : "Editar" }} Sugerido de Venta
</h1>
<div mat-dialog-content>
  <form [formGroup]="sugeridoForm">
    <div class="row g-3">
    <div class="col-12">
    <mat-form-field appearance="outline">
      <mat-label>Sugerido</mat-label>
      <input
        formControlName="sugerido"
        matInput
        placeholder="Codigo"
        maxlength="10"
      />
      <mat-error *ngIf="sugeridoField.hasError('required')"
        >El sugerido es requerido</mat-error
      >
    </mat-form-field>
    </div>
    <div class="col-12">
    <mat-form-field appearance="outline">
      <mat-label>Descripcion</mat-label>
      <input
        formControlName="descripcion"
        matInput
        placeholder="Descripcion"
        maxlength="40"
      />
      <mat-error *ngIf="descripcionField.hasError('required')"
        >La descripcion es requerida</mat-error
      >
    </mat-form-field>
    </div>
      </div>
  </form>
</div>
<div mat-dialog-actions [align]="'end'">
  <button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
  <button mat-raised-button color="warn" (click)="clickSave()">
    {{ actionBtn }}
  </button>
</div>
</div>
