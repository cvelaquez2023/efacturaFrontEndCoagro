<h1 mat-dialog-title color="warn">{{ actionBtn === 'Guardar' ? 'Adicionar' : 'Editar' }} Razón de Efectividad de Visita</h1>
<div mat-dialog-content>
	<form [formGroup]="razonVisitaForm">
		<mat-form-field appearance="outline">
			<mat-label>Código</mat-label>
			<input formControlName="efectVisita" matInput placeholder="Código" maxlength="2" style="text-transform: uppercase" />
			<mat-error *ngIf="efectVisitaField.hasError('required')">El código es requerido</mat-error>
			<mat-error *ngIf="efectVisitaField.hasError('maxlength')">Máximo 2 caracteres</mat-error>
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>Descripción</mat-label>
			<input formControlName="descripcion" matInput placeholder="Descripción" maxlength="20" />
			<mat-error *ngIf="descripcionField.hasError('required')">La descripción es requerida</mat-error>
			<mat-error *ngIf="descripcionField.hasError('maxlength')">Máximo 20 caracteres</mat-error>
		</mat-form-field>
	</form>
</div>
<div mat-dialog-actions [align]="'end'">
	<button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
	<button mat-raised-button color="warn" (click)="clickSave()">{{ actionBtn }}</button>
</div>
