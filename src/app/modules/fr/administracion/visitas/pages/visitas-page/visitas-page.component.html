<div class="fr-page">
<h2 class="fr-title">Visitas</h2>

<div class="fr-card fr-toolbar">
<form class="fr-search">
  <mat-form-field class="full-with" appearance="fill">
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Buscar Visita"
      #input
    />
  </mat-form-field>
</form>
  <button mat-raised-button color="warn" (click)="openDialog()">
    <mat-icon>add</mat-icon>Crear
  </button>
</div>
<div class="fr-table-wrap">
  <table mat-table [dataSource]="listVisitas" matSort>
    <ng-container matColumnDef="RUTA">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ruta</th>
      <td mat-cell *matCellDef="let element">{{ element.RUTA }}</td>
    </ng-container>
    <ng-container matColumnDef="CLIENTE">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Cliente</th
      >
      <td mat-cell *matCellDef="let element">{{ element.CLIENTE }}</td>
    </ng-container>
    <ng-container matColumnDef="INICIO">
      <th mat-header-cell class="fr-center" *matHeaderCellDef mat-sort-header
        >Inicio</th
      >
      <td mat-cell class="fr-center" *matCellDef="let element">{{
        element.INICIO | date: "short"
      }}</td>
    </ng-container>
    <ng-container matColumnDef="RAZON">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Estado</th
      >
      <td mat-cell *matCellDef="let element">{{ element.RAZON }}</td>
    </ng-container>
    <ng-container matColumnDef="TIPO">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Tipo de Visita</th
      >
      <td mat-cell *matCellDef="let element">{{ element.TIPO }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <button mat-icon-button (click)="clickEdit(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="clickDelete(element)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell fr-empty" colspan="6">
        No hay datos que coincidan con el filtro "{{ input.value }}"
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
