<h2>Visitas</h2>

<div class="search-div" fxLayout="row" fxLayoutAlign="end end">
	<button mat-raised-button color="warn" (click)="openDialog()"><mat-icon>add</mat-icon>Crear</button>
</div>

<form class="buscar">
	<mat-form-field class="full-with" appearance="fill">
		<input matInput (keyup)="applyFilter($event)" placeholder="Buscar Visita" #input />
	</mat-form-field>
</form>
<div class="mat-elevation-z8">
	<mat-table [dataSource]="listVisitas" matSort>
		<ng-container matColumnDef="RUTA">
			<mat-header-cell *matHeaderCellDef mat-sort-header>Ruta</mat-header-cell>
			<mat-cell *matCellDef="let element">{{ element.RUTA }}</mat-cell>
		</ng-container>
		<ng-container matColumnDef="CLIENTE">
			<mat-header-cell *matHeaderCellDef mat-sort-header>Cliente</mat-header-cell>
			<mat-cell *matCellDef="let element">{{ element.CLIENTE }}</mat-cell>
		</ng-container>
		<ng-container matColumnDef="INICIO">
			<mat-header-cell *matHeaderCellDef mat-sort-header>Inicio</mat-header-cell>
			<mat-cell *matCellDef="let element">{{ element.INICIO | date: 'short' }}</mat-cell>
		</ng-container>
		<ng-container matColumnDef="RAZON">
			<mat-header-cell *matHeaderCellDef mat-sort-header>Estado</mat-header-cell>
			<mat-cell *matCellDef="let element">{{ element.RAZON }}</mat-cell>
		</ng-container>
		<ng-container matColumnDef="TIPO">
			<mat-header-cell *matHeaderCellDef mat-sort-header>Tipo de Visita</mat-header-cell>
			<mat-cell *matCellDef="let element">{{ element.TIPO }}</mat-cell>
		</ng-container>
		<ng-container matColumnDef="actions">
			<mat-header-cell *matHeaderCellDef></mat-header-cell>
			<mat-cell *matCellDef="let element">
				<button mat-icon-button (click)="clickEdit(element)">
					<mat-icon>edit</mat-icon>
				</button>
				<button mat-icon-button color="warn" (click)="clickDelete(element)"><mat-icon>delete</mat-icon></button>
			</mat-cell>
		</ng-container>

		<mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
		<mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
		<tr class="mat-row" *matNoDataRow>
			<td class="mat-cell" colspan="6">No hay datos que coincidan con el filtro "{{ input.value }}"</td>
		</tr>
	</mat-table>
	<mat-paginator [pageSizeOptions]="[10, 25, 75, 100]" showFirstLastButtons></mat-paginator>
</div>
