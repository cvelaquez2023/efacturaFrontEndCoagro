<div class="fr-page">
<h2 class="fr-title">Hand Helds</h2>

<div class="fr-card fr-toolbar">
<form class="fr-search">
  <mat-form-field class="full-with" appearance="fill">
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Buscar Hand Held"
      #input
    />
  </mat-form-field>
</form>
  <button mat-raised-button color="warn" (click)="openDialog()">
    <mat-icon>add</mat-icon>Crear
  </button>
</div>
<div class="fr-table-wrap">
  <table mat-table [dataSource]="listHandhelds" matSort>
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Código</th
      >
      <td mat-cell *matCellDef="let element">{{ element.HANDHELD }}</td>
    </ng-container>
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Descripción</th
      >
      <td mat-cell *matCellDef="let element">{{ element.DESCRIPCION }}</td>
    </ng-container>
    <ng-container matColumnDef="modelo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Modelo</th
      >
      <td mat-cell *matCellDef="let element">{{ element.MODELO }}</td>
    </ng-container>
    <ng-container matColumnDef="serie">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Serie</th>
      <td mat-cell *matCellDef="let element">{{ element.SERIE }}</td>
    </ng-container>
    <ng-container matColumnDef="estado">
      <th mat-header-cell class="fr-center" *matHeaderCellDef mat-sort-header
        >Estado</th
      >
      <td mat-cell class="fr-center" *matCellDef="let element">
        <mat-icon [color]="element.ESTADO === 'A' ? 'primary' : 'warn'">{{
          element.ESTADO === "A" ? "check_circle" : "cancel"
        }}</mat-icon>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <button mat-icon-button (click)="clickEdit(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          (click)="clickDelete(element.HANDHELD)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell fr-empty" colspan="6">
        No hay datos que coincidan con el filtro "{{ input.value }}"
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
