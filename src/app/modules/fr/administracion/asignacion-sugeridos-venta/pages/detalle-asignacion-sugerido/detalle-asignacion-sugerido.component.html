<h1 mat-dialog-title color="warn">Asignacion de Sugerido de Venta</h1>
<div mat-dialog-content>
	<form [formGroup]="asignacionForm">
		<mat-form-field appearance="outline">
			<mat-label>Cliente</mat-label>
			<input formControlName="cliente" matInput placeholder="Codigo de cliente" />
			<mat-error *ngIf="clienteField.hasError('required')">El cliente es requerido</mat-error>
		</mat-form-field>
		<mat-form-field appearance="outline">
			<mat-label>Sugerido</mat-label>
			<input formControlName="sugerido" matInput placeholder="Codigo de sugerido" />
			<mat-error *ngIf="sugeridoField.hasError('required')">El sugerido es requerido</mat-error>
		</mat-form-field>
	</form>

	<h3>Articulos y cantidades sugeridas</h3>
	<table class="full-with">
		<tr>
			<th>Articulo</th>
			<th>Descripcion</th>
			<th>Cantidad Almacen</th>
			<th>Cantidad Detalle</th>
		</tr>
		<tr *ngFor="let art of articulos">
			<td>{{ art.articulo }}</td>
			<td>{{ art.descripcion }}</td>
			<td>{{ art.cantidadAlmacen }}</td>
			<td>{{ art.cantidadDetalle }}</td>
		</tr>
	</table>
</div>
<div mat-dialog-actions [align]="'end'">
	<button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
	<button mat-raised-button color="warn" (click)="clickSave()">Guardar</button>
</div>
