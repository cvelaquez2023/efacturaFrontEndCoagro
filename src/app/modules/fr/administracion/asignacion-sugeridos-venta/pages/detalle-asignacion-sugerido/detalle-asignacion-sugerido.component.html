<div class="fr-page fr-dialog">
<h1 mat-dialog-title color="warn">Asignacion de Sugerido de Venta</h1>
<div mat-dialog-content>
  <form [formGroup]="asignacionForm">
    <div class="row g-3">
    <div class="col-12">
    <mat-form-field appearance="outline">
      <mat-label>Cliente</mat-label>
      <input
        formControlName="cliente"
        matInput
        placeholder="Codigo de cliente"
      />
      <mat-error *ngIf="clienteField.hasError('required')"
        >El cliente es requerido</mat-error
      >
    </mat-form-field>
    </div>
    <div class="col-12">
    <mat-form-field appearance="outline">
      <mat-label>Sugerido</mat-label>
      <input
        formControlName="sugerido"
        matInput
        placeholder="Codigo de sugerido"
      />
      <mat-error *ngIf="sugeridoField.hasError('required')"
        >El sugerido es requerido</mat-error
      >
    </mat-form-field>
    </div>
      </div>
  </form>

  <h3 class="fr-subtitle">Articulos y cantidades sugeridas</h3>
  <div class="fr-table-wrap">
  <table class="fr-simple">
    <tr>
      <th>Articulo</th>
      <th>Descripcion</th>
      <th class="fr-num">Cantidad Almacen</th>
      <th class="fr-num">Cantidad Detalle</th>
    </tr>
    <tr *ngFor="let art of articulos">
      <td>{{ art.articulo }}</td>
      <td>{{ art.descripcion }}</td>
      <td class="fr-num">{{ art.cantidadAlmacen }}</td>
      <td class="fr-num">{{ art.cantidadDetalle }}</td>
    </tr>
  </table>
  </div>
</div>
<div mat-dialog-actions [align]="'end'">
  <button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
  <button mat-raised-button color="warn" (click)="clickSave()">Guardar</button>
</div>
</div>
