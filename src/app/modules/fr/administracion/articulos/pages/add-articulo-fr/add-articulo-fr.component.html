<h1 mat-dialog-title color="warn">Editar Articulo</h1>
<div mat-dialog-content>
  <form [formGroup]="articuloForm">
    <mat-form-field appearance="outline">
      <mat-label>Código</mat-label>
      <input formControlName="articulo" matInput />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <input
        formControlName="descripcion"
        matInput
        placeholder="Descripción"
        maxlength="254"
      />
      <mat-error *ngIf="descripcionField.hasError('required')"
        >La descripción es requerida</mat-error
      >
      <mat-error *ngIf="descripcionField.hasError('maxlength')"
        >Máximo 254 caracteres</mat-error
      >
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Factor Precio</mat-label>
      <input
        formControlName="factorPrecio"
        matInput
        type="number"
        placeholder="Factor Precio"
      />
    </mat-form-field>
    <div fxLayout="row" fxLayoutGap="12px">
      <mat-form-field appearance="outline">
        <mat-label>Orden</mat-label>
        <input formControlName="ordenArticulo" matInput placeholder="Orden" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Bodega</mat-label>
        <input formControlName="bodega" matInput placeholder="Bodega" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Localización</mat-label>
        <input
          formControlName="localizacion"
          matInput
          placeholder="Localización"
        />
      </mat-form-field>
    </div>
  </form>
</div>
<div mat-dialog-actions [align]="'end'">
  <button mat-raised-button color="basic" mat-dialog-close>Cerrar</button>
  <button mat-raised-button color="warn" (click)="clickSave()">Editar</button>
</div>
