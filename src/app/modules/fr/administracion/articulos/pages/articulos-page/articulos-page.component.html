<div class="fr-page">
<h2 class="fr-title">Articulos</h2>

<div class="fr-card fr-toolbar">
<form class="fr-search">
  <mat-form-field class="full-with" appearance="fill">
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Buscar Articulo"
      #input
    />
  </mat-form-field>
</form>
</div>
<div class="fr-table-wrap">
  <table mat-table [dataSource]="listArticulos" matSort>
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Código</th
      >
      <td mat-cell *matCellDef="let element">{{ element.ARTICULO }}</td>
    </ng-container>
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Descripción</th
      >
      <td mat-cell *matCellDef="let element">{{ element.DESCRIPCION }}</td>
    </ng-container>
    <ng-container matColumnDef="bodega">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Bodega</th
      >
      <td mat-cell *matCellDef="let element">{{ element.BODEGA }}</td>
    </ng-container>
    <ng-container matColumnDef="grupoArticulo">
      <th mat-header-cell *matHeaderCellDef>Grupo de Artículo</th>
      <td mat-cell *matCellDef="let element">{{
        grupoPorArticulo.get(element.ARTICULO) ?? "-"
      }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <button mat-icon-button (click)="clickEdit(element)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell fr-empty" [attr.colspan]="displayedColumns.length">
        No hay datos que coincidan con el filtro "{{ input.value }}"
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
