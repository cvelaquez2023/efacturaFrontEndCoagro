<div class="fr-page">
<h2 class="fr-title">Grupos de Artículos</h2>

<div class="fr-card fr-toolbar">
<form class="fr-search">
  <mat-form-field class="full-with" appearance="fill">
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Buscar Grupo"
      #input
    />
  </mat-form-field>
</form>
  <button mat-raised-button color="warn" (click)="openDialog()">
    <mat-icon>add</mat-icon>Crear
  </button>
</div>
<div class="fr-table-wrap">
  <table mat-table [dataSource]="listGrupos" matSort>
    <ng-container matColumnDef="grupo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Grupo</th>
      <td mat-cell *matCellDef="let element">{{
        element.GRUPO_ARTICULO
      }}</td>
    </ng-container>
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Descripción</th
      >
      <td mat-cell *matCellDef="let element">{{ element.DESCRIPCION }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <button mat-icon-button (click)="clickEdit(element)">
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          (click)="clickDelete(element.GRUPO_ARTICULO)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell fr-empty" colspan="3">
        No hay datos que coincidan con el filtro "{{ input.value }}"
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
