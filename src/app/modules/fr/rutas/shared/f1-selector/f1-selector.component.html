<h2 mat-dialog-title>
  <mat-icon class="f1-title-icon">search</mat-icon>
  {{ data.titulo }}
</h2>
<div mat-dialog-content>
  <mat-form-field appearance="fill" class="full-with">
    <mat-label>Buscar</mat-label>
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Escriba para filtrar..."
      #input
    />
    <mat-icon matSuffix>filter_list</mat-icon>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="f1-table">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>
        {{ data.columnaCodigo || "Código" }}
      </th>
      <td mat-cell *matCellDef="let item">{{ item.codigo }}</td>
    </ng-container>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>
        {{ data.columnaNombre || "Nombre" }}
      </th>
      <td mat-cell *matCellDef="let item">{{ item.nombre }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      (dblclick)="seleccionar(row)"
      class="f1-row"
    ></tr>
  </table>
  <p *ngIf="dataSource.filteredData.length === 0" class="f1-empty">
    No hay registros que coincidan con el filtro "{{ input.value }}"
  </p>
</div>
<div mat-dialog-actions [align]="'end'">
  <button mat-raised-button color="basic" mat-dialog-close>Cancelar</button>
</div>
