<div class="fr-page">
<h2 class="fr-title">Cargar Bodegas</h2>
<p class="fr-help">
  Seleccione las bodegas ya existentes en el ERP que desea habilitar en el
  módulo de rutas.
</p>

<div class="fr-card">
<div class="row g-3 align-items-center">
  <div class="col-12 col-md-8">
    <mat-form-field class="full-with" appearance="fill">
      <mat-label>Buscar bodega</mat-label>
      <input
        matInput
        (keyup)="onBuscar($event)"
        placeholder="Código o nombre de la bodega"
      />
    </mat-form-field>
  </div>
  <div class="col-12 col-md-4 seleccionados-wrapper">
    <span class="seleccionados-info"
      >{{ selectedBodegas.size }} seleccionado(s)</span
    >
  </div>
</div>
</div>

<div *ngIf="cargando" class="spinner-wrapper">
  <mat-progress-spinner
    mode="indeterminate"
    diameter="36"
  ></mat-progress-spinner>
</div>

<div *ngIf="!cargando" class="fr-table-wrap grid-wrapper">
  <table mat-table [dataSource]="bodegasErp">
    <ng-container matColumnDef="seleccionado">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions"></th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <mat-checkbox
          [checked]="isSelected(element.BODEGA)"
          (change)="toggleBodega(element, $event.checked)"
        ></mat-checkbox>
      </td>
    </ng-container>
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let element">{{ element.BODEGA }}</td>
    </ng-container>
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let element">{{ element.NOMBRE }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell fr-empty" [attr.colspan]="displayedColumns.length">
        No hay bodegas que coincidan con la búsqueda
      </td>
    </tr>
  </table>
  <mat-paginator
    [length]="total"
    [pageIndex]="page - 1"
    [pageSize]="limit"
    [pageSizeOptions]="[20, 50, 100]"
    showFirstLastButtons
    (page)="onPageChange($event)"
  ></mat-paginator>
</div>

<div class="fr-card acciones-wrapper">
  <button
    mat-raised-button
    color="warn"
    [disabled]="selectedBodegas.size === 0 || procesando"
    (click)="cargarSeleccionados()"
  >
    <mat-icon>cloud_upload</mat-icon>
    Cargar ({{ selectedBodegas.size }})
  </button>
</div>
</div>
