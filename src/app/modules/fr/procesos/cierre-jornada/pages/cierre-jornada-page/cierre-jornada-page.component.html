<div class="fr-page">
<h2 class="fr-title">Cierre de Jornada</h2>

<form [formGroup]="filtroForm" class="fr-card">
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-lg-4">
  <mat-form-field appearance="outline">
    <mat-label>Fecha</mat-label>
    <input formControlName="fecha" matInput type="date" />
  </mat-form-field>
    </div>
  </div>
</form>

<div class="fr-table-wrap">
  <table mat-table [dataSource]="listJornadas" matSort>
    <ng-container matColumnDef="ruta">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ruta</th>
      <td mat-cell *matCellDef="let element">{{ element.ruta }}</td>
    </ng-container>
    <ng-container matColumnDef="agente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Agente</th
      >
      <td mat-cell *matCellDef="let element">{{ element.agente }}</td>
    </ng-container>
    <ng-container matColumnDef="visitasRealizadas">
      <th mat-header-cell class="fr-num" *matHeaderCellDef mat-sort-header
        >Visitas</th
      >
      <td mat-cell class="fr-num" *matCellDef="let element">{{
        element.visitasRealizadas
      }}</td>
    </ng-container>
    <ng-container matColumnDef="totalVendido">
      <th mat-header-cell class="fr-num" *matHeaderCellDef mat-sort-header
        >Total Vendido</th
      >
      <td mat-cell class="fr-num" *matCellDef="let element">{{
        element.totalVendido | currency: "USD"
      }}</td>
    </ng-container>
    <ng-container matColumnDef="totalCobrado">
      <th mat-header-cell class="fr-num" *matHeaderCellDef mat-sort-header
        >Total Cobrado</th
      >
      <td mat-cell class="fr-num" *matCellDef="let element">{{
        element.totalCobrado | currency: "USD"
      }}</td>
    </ng-container>
    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Estado</th
      >
      <td mat-cell *matCellDef="let element">{{ element.estado }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <button
          mat-raised-button
          color="warn"
          [disabled]="element.estado === 'Cerrada'"
          (click)="cerrarJornada(element)"
        >
          Cerrar
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
