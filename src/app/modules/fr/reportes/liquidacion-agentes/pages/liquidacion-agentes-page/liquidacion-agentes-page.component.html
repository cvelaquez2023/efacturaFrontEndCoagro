<h2>Liquidacion de Agentes</h2>

<form
  [formGroup]="filtroForm"
  class="filtro-reporte"
  fxLayout="row wrap"
  fxLayoutGap="16px"
  fxLayoutAlign="start center"
>
  <mat-form-field appearance="outline">
    <mat-label>Compania (opcional)</mat-label>
    <input formControlName="compania" matInput />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Agente</mat-label>
    <input formControlName="agente" matInput placeholder="Codigo de agente" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Ruta</mat-label>
    <input formControlName="ruta" matInput placeholder="Codigo de ruta" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Fecha Desde</mat-label>
    <input formControlName="fechaDesde" matInput type="date" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Fecha Hasta</mat-label>
    <input formControlName="fechaHasta" matInput type="date" />
  </mat-form-field>
  <button mat-raised-button color="warn" (click)="generar()">
    <mat-icon>print</mat-icon>Generar
  </button>
</form>

<div class="mat-elevation-z8">
  <mat-table [dataSource]="resultados" matSort>
    <ng-container matColumnDef="tipoDocumento">
      <mat-header-cell *matHeaderCellDef mat-sort-header
        >Tipo Documento</mat-header-cell
      >
      <mat-cell *matCellDef="let element">{{ element.tipoDocumento }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="consecutivo">
      <mat-header-cell *matHeaderCellDef mat-sort-header
        >Consecutivo</mat-header-cell
      >
      <mat-cell *matCellDef="let element">{{ element.consecutivo }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="cliente">
      <mat-header-cell *matHeaderCellDef mat-sort-header
        >Cliente</mat-header-cell
      >
      <mat-cell *matCellDef="let element">{{ element.cliente }}</mat-cell>
    </ng-container>
    <ng-container matColumnDef="monto">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Monto</mat-header-cell>
      <mat-cell *matCellDef="let element">{{
        element.monto | currency: "USD"
      }}</mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
  <p class="total-liquidacion">
    <strong>Total liquidacion:</strong> {{ totalLiquidacion | currency: "USD" }}
  </p>
</div>
