<fieldset class="rango">
  <legend>{{ titulo }}</legend>
  <div
    *ngFor="let extremo of [{ etiqueta: 'Desde', c: desde }, { etiqueta: 'Hasta', c: hasta }]"
    class="row g-2 align-items-start"
  >
    <span class="etiqueta col-12 col-sm-2">{{ extremo.etiqueta }}:</span>
    <div class="col-5 col-sm-4">
      <mat-form-field appearance="outline">
        <input
          matInput
          [formControl]="control(extremo.c)"
          (keydown.f1)="$event.preventDefault(); buscar(extremo.c)"
          placeholder="F1 para buscar"
        />
        <button mat-icon-button matSuffix type="button" (click)="buscar(extremo.c)" matTooltip="Buscar (F1)">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    </div>
    <div class="col-7 col-sm-6">
      <mat-form-field appearance="outline">
        <input matInput [value]="nombre(extremo.c)" readonly tabindex="-1" />
      </mat-form-field>
    </div>
  </div>
</fieldset>
