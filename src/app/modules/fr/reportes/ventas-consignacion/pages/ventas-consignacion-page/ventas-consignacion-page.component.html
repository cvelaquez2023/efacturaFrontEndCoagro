<div class="fr-page">
<h2 class="fr-title">Ventas en Consignacion</h2>

<form [formGroup]="filtroForm"
 class="fr-card">
  <div class="row g-3 align-items-center">
  <div class="col-12 col-sm-6 col-lg-3">
    <mat-form-field appearance="outline">
    <mat-label>Compania</mat-label>
    <input formControlName="compania" matInput />
  </mat-form-field>
  </div>
  <div class="col-12 col-sm-6 col-lg-3">
    <mat-form-field appearance="outline">
    <mat-label>Rutas (opcional)</mat-label>
    <input formControlName="rutas" matInput placeholder="Rango de rutas" />
  </mat-form-field>
  </div>
  <div class="col-12 col-sm-6 col-lg-3">
    <mat-form-field appearance="outline">
    <mat-label>Clientes (opcional)</mat-label>
    <input
      formControlName="clientes"
      matInput
      placeholder="Rango de clientes"
    />
  </mat-form-field>
  </div>
  <div class="col-12 col-lg fr-actions justify-content-end">
    <button mat-stroked-button type="button" (click)="generar()">
      <mat-icon>search</mat-icon> Consultar
    </button>
    <button mat-raised-button color="primary" type="button" (click)="generarReporte()">
      <mat-icon>summarize</mat-icon> Generar Reporte
    </button>
  </div>
  </div>
</form>

<div class="fr-table-wrap">
  <table mat-table [dataSource]="resultados" matSort>
    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Cliente</th
      >
      <td mat-cell *matCellDef="let element">{{ element.cliente }}</td>
    </ng-container>
    <ng-container matColumnDef="ruta">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ruta</th>
      <td mat-cell *matCellDef="let element">{{ element.ruta }}</td>
    </ng-container>
    <ng-container matColumnDef="articulo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Articulo</th
      >
      <td mat-cell *matCellDef="let element">{{ element.articulo }}</td>
    </ng-container>
    <ng-container matColumnDef="cantidad">
      <th mat-header-cell class="fr-num" *matHeaderCellDef mat-sort-header
        >Cantidad</th
      >
      <td mat-cell class="fr-num" *matCellDef="let element">{{ element.cantidad }}</td>
    </ng-container>
    <ng-container matColumnDef="monto">
      <th mat-header-cell class="fr-num" *matHeaderCellDef mat-sort-header>Monto</th>
      <td mat-cell class="fr-num" *matCellDef="let element">{{
        element.monto | currency: "USD"
      }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
