<div class="fr-page">
<h2 class="fr-title">Aprobar Devolucion</h2>

<div class="fr-card fr-toolbar">
<form class="fr-search">
  <mat-form-field class="full-with" appearance="fill">
    <input
      matInput
      (keyup)="applyFilter($event)"
      placeholder="Buscar Devolucion"
      #input
    />
  </mat-form-field>
</form>
  <button mat-raised-button color="warn" (click)="aprobarSeleccionadas()">
    <mat-icon>check</mat-icon>Aprobar
  </button>
</div>
<div class="fr-table-wrap">
  <table mat-table [dataSource]="listDevoluciones" matSort>
    <ng-container matColumnDef="seleccionada">
      <th mat-header-cell class="fr-center" *matHeaderCellDef></th>
      <td mat-cell class="fr-center" *matCellDef="let element">
        <mat-checkbox
          [(ngModel)]="element.seleccionada"
          [disabled]="element.estado !== 'Nuevo'"
        ></mat-checkbox>
      </td>
    </ng-container>
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Devolucion</th
      >
      <td mat-cell *matCellDef="let element">{{ element.codigo }}</td>
    </ng-container>
    <ng-container matColumnDef="ruta">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ruta</th>
      <td mat-cell *matCellDef="let element">{{ element.ruta }}</td>
    </ng-container>
    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Cliente</th
      >
      <td mat-cell *matCellDef="let element">{{ element.cliente }}</td>
    </ng-container>
    <ng-container matColumnDef="documentoReferencia">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Documento Referencia</th
      >
      <td mat-cell *matCellDef="let element">{{
        element.documentoReferencia || "-"
      }}</td>
    </ng-container>
    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
        >Estado</th
      >
      <td mat-cell *matCellDef="let element">{{ element.estado }}</td>
    </ng-container>
    <ng-container matColumnDef="fecha">
      <th mat-header-cell class="fr-center" *matHeaderCellDef mat-sort-header>Fecha</th>
      <td mat-cell class="fr-center" *matCellDef="let element">{{
        element.fecha | date: "shortDate"
      }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let element" class="fr-col-actions">
        <button
          mat-icon-button
          (click)="verDetalle(element)"
          matTooltip="Ver detalle"
        >
          <mat-icon>visibility</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell fr-empty" colspan="8">
        No hay datos que coincidan con el filtro
      </td>
    </tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 75, 100]"
    showFirstLastButtons
  ></mat-paginator>
</div>
</div>
