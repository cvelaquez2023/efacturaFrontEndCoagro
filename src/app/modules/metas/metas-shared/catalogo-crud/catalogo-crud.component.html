<div class="fr-card fr-toolbar catalogo-toolbar">
  <mat-form-field appearance="fill" class="catalogo-busqueda">
    <mat-label>Buscar {{ config.singular }}</mat-label>
    <input matInput [formControl]="busqueda" placeholder="Código o nombre" autocomplete="off" />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
  <mat-form-field appearance="fill" class="catalogo-estado">
    <mat-label>Estado</mat-label>
    <mat-select [formControl]="filtroActivo">
      <mat-option value="">Todos</mat-option>
      <mat-option value="S">Activos</mat-option>
      <mat-option value="N">Inactivos</mat-option>
    </mat-select>
  </mat-form-field>
  <span class="espacio"></span>
  <button mat-stroked-button type="button" (click)="exportar()">
    <mat-icon>download</mat-icon>CSV
  </button>
  <button mat-raised-button color="warn" type="button" (click)="abrir()">
    <mat-icon>add</mat-icon>Crear
  </button>
</div>

<div class="fr-table-wrap">
  <table mat-table [dataSource]="filas">
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let f">{{ f.codigo }}</td>
    </ng-container>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let f">{{ f.nombre }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let f">{{ f.email || "—" }}</td>
    </ng-container>
    <ng-container matColumnDef="activo">
      <th mat-header-cell *matHeaderCellDef class="fr-center">Estado</th>
      <td mat-cell *matCellDef="let f" class="fr-center">
        <span class="estado" [class.inactivo]="!activo(f)">{{ activo(f) ? "Activo" : "Inactivo" }}</span>
      </td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef class="fr-col-actions">Acciones</th>
      <td mat-cell *matCellDef="let f" class="fr-col-actions">
        <button mat-icon-button type="button" matTooltip="Editar" (click)="abrir(f)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" color="warn" matTooltip="Eliminar" (click)="eliminar(f)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell fr-empty" [attr.colspan]="columnas.length">
        {{ cargando ? "Consultando…" : "No hay registros" }}
      </td>
    </tr>
  </table>
  <mat-paginator
    [length]="total"
    [pageIndex]="page - 1"
    [pageSize]="limit"
    [pageSizeOptions]="[10, 20, 50, 100]"
    showFirstLastButtons
    (page)="cambiarPagina($event)"
  ></mat-paginator>
</div>
